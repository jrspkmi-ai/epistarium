name: EPISTARIUM candidate checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: python -m epistarium doctor --lang en
      - run: python -m epistarium doctor --lang id
      - run: python scripts/verify_skills.py
      - run: python scripts/check_docs.py
      - run: python scripts/check_english.py
      - run: python -m pytest -q
      - run: python -m build --no-isolation
      - run: python scripts/smoke_tutorial.py --out private/ci-tutorial-en --lang en --report private/ci-tutorial-en.json
      - run: python scripts/smoke_tutorial.py --out private/ci-tutorial-id --lang id --report private/ci-tutorial-id.json
      - run: python scripts/package_release.py --out ../EPISTARIUM_v0.7.1_RELEASE_CANDIDATE.zip
