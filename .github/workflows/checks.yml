name: EPISTARIUM v0.8.0 candidate checks
on:
  push:
    branches: [main]
    # For code changes (any files other than docs, assets, README) run lightweight matrix
    # Docs/asset changes are handled by a separate workflow (checks-docs.yml)
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test_code:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "[test]"
      - run: python -m pip check
      - run: python -m epistarium doctor --lang en
      - run: python -m epistarium doctor --lang id
      - run: python scripts/verify_skills.py
      - run: python scripts/check_docs.py
      - run: python scripts/check_english.py
      - run: python -m epistarium observatory --help
      - run: node --check epistarium/observatory/static/app.js
      - run: python -m pytest -q
      - run: python -m build --no-isolation
      - run: python scripts/smoke_tutorial.py --out private/ci-tutorial-en --lang en --report private/ci-tutorial-en.json
      - run: python scripts/smoke_tutorial.py --out private/ci-tutorial-id --lang id --report private/ci-tutorial-id.json
      - run: python scripts/package_release.py --out ../EPISTARIUM_v0.8.0_RELEASE_CANDIDATE.zip

  test_release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "[test]"
      - run: python -m pip check
      - run: python -m epistarium doctor --lang en
      - run: python -m epistarium doctor --lang id
      - run: python scripts/verify_skills.py
      - run: python scripts/check_docs.py
      - run: python scripts/check_english.py
      - run: python -m epistarium observatory --help
      - run: node --check epistarium/observatory/static/app.js
      - run: python -m pytest -q
      - run: python -m build --no-isolation
      - run: python scripts/smoke_tutorial.py --out private/ci-tutorial-en --lang en --report private/ci-tutorial-en.json
      - run: python scripts/smoke_tutorial.py --out private/ci-tutorial-id --lang id --report private/ci-tutorial-id.json
      - run: python scripts/package_release.py --out ../EPISTARIUM_v0.8.0_RELEASE_CANDIDATE.zip